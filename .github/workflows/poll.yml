name: poll
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Poll
        id: poll
        continue-on-error: true
        env:
          POLL_COLLECTOR_URL: https://tibo.c-quinn.xyz/api/reset-source
        run: pnpm poll
      - name: Commit data
        if: steps.poll.outputs.changed == '1'
        run: bash scripts/commit-data.sh
      - name: Mark poll failure after persisting state
        if: always() && steps.poll.outcome == 'failure'
        run: exit 1
