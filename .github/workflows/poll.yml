name: poll
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Poll
        id: poll
        run: pnpm poll
      - name: Commit data
        if: steps.poll.outputs.changed == '1'
        env:
          COUNT: ${{ steps.poll.outputs.changedCount }}
        run: |
          git pull --rebase
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "sentinel-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(data): ${COUNT:-1+} new event(s) [skip ci]"
          git push
      - name: Mark poll failure after persisting state
        if: steps.poll.outputs.failed == '1'
        run: exit 1
