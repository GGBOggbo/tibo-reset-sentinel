name: poll
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Poll
        id: poll
        env:
          LARK_SUBSCRIBE_WEBHOOK: ${{ secrets.LARK_SUBSCRIBE_WEBHOOK }}
          LARK_OPS_WEBHOOK: ${{ secrets.LARK_OPS_WEBHOOK }}
        run: pnpm poll
      - name: Commit data
        if: steps.poll.outputs.changed == '1'
        env:
          COUNT: ${{ steps.poll.outputs.changedCount }}
        run: |
          git config user.name "sentinel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): ${COUNT:-1+} new event(s) [skip ci]"
          git push
